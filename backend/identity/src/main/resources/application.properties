server.port=${SERVER_PORT:8081}
spring.application.name=Identity
identity.account.max-password-length=${IDENTITY_MAX_PASSWORD_LENGTH:255}
identity.account.min-password-length=${IDENTITY_MIN_PASSWORD_LENGTH:8}
identity.account.require-digit=${IDENTITY_REQUIRE_DIGIT:true}
identity.account.require-lowercase=${IDENTITY_REQUIRE_LOWERCASE:true}
identity.account.require-special-character=${IDENTITY_REQUIRE_SPECIAL_CHARACTER:true}
identity.account.require-uppercase=${IDENTITY_REQUIRE_UPPERCASE:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.docker.compose.enabled=false
