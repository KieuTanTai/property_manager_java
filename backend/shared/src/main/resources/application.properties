spring.application.name=shared
application.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
application.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:8}
application.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:200}
application.async.await-termination=${ASYNC_AWAIT_TERMINATION:60s}
application.async.thread-name-prefix=${ASYNC_THREAD_NAME_PREFIX:application-async-}
